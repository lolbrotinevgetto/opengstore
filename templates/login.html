<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход в OpenGstore</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #121317; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background-color: #1a1b20; padding: 40px; border-radius: 12px; width: 100%; max-width: 350px; border: 1px solid #2d2e35; text-align: center; }
        h2 { margin-top: 0; margin-bottom: 25px; font-size: 22px; color: #fff; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #3f404a; background-color: #2d2e35; color: white; box-sizing: border-box; font-size: 15px; outline: none; }
        input:focus { border-color: #3b82f6; }
        .btn { background-color: #3b82f6; color: white; padding: 12px; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-weight: 600; font-size: 16px; margin-bottom: 15px; transition: 0.2s; }
        .btn:hover { background-color: #2563eb; }
        .error { color: #fca5a5; margin-bottom: 15px; font-size: 14px; }
        a { color: #9ca3af; font-size: 14px; text-decoration: none; }
        a:hover { color: #fff; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Вход в аккаунт</h2>
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <input type="text" name="username" placeholder="Логин (admin)" required>
            <input type="password" name="password" placeholder="Пароль (123)" required>
            <button type="submit" class="btn">Войти</button>
        </form>
        <a href="/">← Вернуться в магазин</a>
    </div>
</body>
</html>
